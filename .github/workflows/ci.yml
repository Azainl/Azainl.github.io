name: CI（质量检查）

# 本工作流是发布门禁：deploy.yml 由这里的成功结果触发（workflow_run + branches: [main]）。
# 若此处的类型检查 / 构建 / 浏览器回归任一失败，Pages 不会被部署，坏版本不会上线。
# 应急手动发布走 deploy.yml 的 workflow_dispatch，可绕过本门禁。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # .astro/ 不进版本库，克隆后必须先同步内容集合类型，否则类型检查找不到 astro:content
      - name: 同步内容集合类型
        run: npm run sync

      - name: 类型检查
        run: npm run typecheck

      # 技能目录不在版本库内（见 link-skills.mjs 说明）。CI / 干净克隆下
      # 工作区技能目录不存在，这一步会打印 SKIP 并以 0 退出；在有技能的开发机上
      # 才会真正校验链接有效性。放在构建之前，尽早暴露链接损坏。
      - name: 校验技能链接（无技能目录时跳过）
        run: npm run check:skills

      - name: 构建
        run: npm run build

      # check.mjs 是无头 Chrome + CDP 的浏览器回归（约 130 条断言）。
      # runner 自带 Chrome，只需要告诉脚本它在哪；脚本支持 CHROME_BIN 覆盖。
      - name: 启动预览服务器
        run: |
          npm run preview -- --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:4321/ > /dev/null && echo "预览服务器就绪" && exit 0
            sleep 1
          done
          echo "预览服务器 40 秒内未就绪" && cat preview.log && exit 1

      - name: 浏览器回归检查
        env:
          BASE_URL: http://localhost:4321
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || echo /usr/bin/google-chrome)"
          echo "使用 Chrome: $CHROME_BIN"
          npm run check

      - name: 失败时保留预览日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-log
          path: preview.log
          if-no-files-found: ignore
